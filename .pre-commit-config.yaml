# Hooks de pre-commit (regla 2.4 de CLAUDE.md). Instalar con: uv run pre-commit install
# Versiones fijadas y verificadas el 2026-11-13 con `git ls-remote --tags`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # misma versión que el ruff de uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Ignora solo las líneas de campos de hash (commit, sha256, md5, *_hash) con un valor
        # hexadecimal de 12 a 64 caracteres: los resultados y metadatos del proyecto los registran
        # por diseño (p. ej. `config_hash`, 12 caracteres, en `run_metadata.json`).
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-lines
          - '"[a-z_]*(commit|sha256|md5|hash)[a-z_]*": "[0-9a-f]{12,64}"'
        # Registros de hashes por diseño (SHA-256 y commits): darían falsos positivos.
        exclude: ^(uv\.lock|data/MANIFEST\.json|data/splits/HASHES\.json)$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout  # los notebooks se versionan sin salidas

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # Las copias de terceros (tablas de Bartel et al., 2019) se guardan byte a byte idénticas
      # al original, para poder verificar su hash; no se normalizan espacios ni finales de línea.
      - id: end-of-file-fixer
        exclude: &vendored ^(src/perovskite_pu/features/data/|tests/fixtures/bartel2019_)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *vendored
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *vendored
      - id: detect-private-key
