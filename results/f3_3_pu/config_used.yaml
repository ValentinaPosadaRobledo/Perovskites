_pu:
  bagging:
    n_bags: 20
    unlabeled_sample_size: n_positive
  kind: pu_bagging
  preprocessing:
    add_missing_indicator: true
  search:
    learners:
      gradient_boosting:
        fixed:
          learning_rate: 0.1
          n_estimators: 50
        space:
          max_depth:
          - 2
          - 3
          - 5
          max_features:
          - sqrt
          - 0.3
          - 0.5
          min_samples_leaf:
          - 1
          - 5
          - 10
          subsample:
          - 0.8
          - 1.0
      random_forest:
        fixed:
          n_estimators: 25
        space:
          max_depth:
          - null
          - 5
          - 10
          - 20
          max_features:
          - sqrt
          - 0.3
          - 0.5
          min_samples_leaf:
          - 1
          - 2
          - 5
          - 10
    n_iter: 15
  subset: family
