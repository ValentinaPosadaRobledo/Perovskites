data:
  config: configs/data.yaml
  folds: data/splits/folds.parquet
  input: data/processed/train_pool.parquet
description: Bagging PU con Random Forest o Gradient Boosting (el aprendiz es un hiperparámetro),
  con búsqueda aleatoria de presupuesto fijo y umbral a recall 0,90 en el bucle interno
  (§7.1).
evaluation:
  fixed_ppr:
  - 0.05
  - 0.1
  - 0.2
execution:
  dev_mode: false
  n_jobs: -1
hypotheses:
- H1
- H2
- H3
inner_cv:
  n_splits: 3
  split: stratified
  target_recall: 0.9
