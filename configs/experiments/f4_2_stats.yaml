# F4.2: pruebas estadísticas preregistradas sobre la validación cruzada (preregistro §8–9).
# No entrena nada: lee los raw/ por composición de F3.3 (modelo PU) y de F2.4 (τ) y aplica
# `perovskite_pu.evaluation.stats`. Los valores de este archivo son los del preregistro
# (fijados el 2026-11-13); no se ajustan mirando resultados.

name: f4_2_stats
description: >-
  H1 (caída de TPR de random a cada esquema por grupos) y H2 (no inferioridad del PU pre_dft
  frente a τ a igual P(ŷ=1)), con bootstrap jerárquico pareado por composición y Holm.
roadmap_task: F4.2
hypotheses: [H1, H2]

inputs:
  pu_experiment: f3_3_pu          # última corrida completada en results/runs_index.csv
  pu_model: pu_pre_dft            # modelo confirmatorio (§8, H1 y H2)
  descriptive_models: [pu_post_dft]  # H1 descriptivo (sin decisión)
  tau_experiment: f2_4_baselines
  tau_model: tau_bartel

data:
  config: configs/data.yaml       # familias de los elementos B (estratos de `family`)
  input: data/processed/train_pool.parquet   # elementos A y B de cada composición

stats:
  confirmatory_schemes: [loeo_A, loeo_B, family, cluster]
  reference_scheme: random
  n_boot: 10000                   # §9
  ci: 0.95
  alpha_h1: 0.05                  # bilateral, con Holm sobre los 4 esquemas
  delta1: 0.05                    # §8
  delta2: 0.05                    # §8
  alpha_h2_one_sided: 0.025       # equivale a la cota inferior del IC 95 % > −δ₂

# Comparaciones secundarias (§9, no confirmatorias; diseño fijado el 2026-11-20 por la autora,
# después de ver F3.3 y antes de calcularlas). Diferencia de TPR a P(ŷ=1) fija, fold a fold,
# sobre las composiciones puntuadas por los dos modelos; Holm sobre las líneas base de cada
# esquema.
nadeau_bengio:
  schemes: [random, cluster]      # CV repetida con folds aleatorios (§9)
  ppr: 0.10                       # §7.3
  alpha: 0.05
  ci: 0.95
  comparators:                    # se buscan en los raw/ de F3.3 y de F2.4
    - pu_post_dft                 # subconjunto post_dft (193 P, 587 U)
    - ehull_model                 # solo E_hull (subconjunto post_dft)
    - symmetry_model              # solo simetría (subconjunto post_dft)
    - tau_bartel                  # τ < 4,18 (τ definido)
    - t_window_bartel             # ventana de t de Bartel (t definido)
    - charge_balance_icsd         # balance de carga con estados de ICSD
