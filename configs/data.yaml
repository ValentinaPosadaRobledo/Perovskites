# Configuración de datos: consulta a MP, identificación de perovskitas, familias
# químicas, particiones y holdout. Los valores marcados "PROPUESTA" se validan en
# la tarea indicada y cualquier cambio se registra en la bitácora del ROADMAP.

# ---------------------------------------------------------------------------
# F1.1 Consulta a Materials Project
# ---------------------------------------------------------------------------
materials_project:
  api_key_env: MP_API_KEY  # nombre de la variable, no la clave  # pragma: allowlist secret
  formula_anonymous: ABC3            # verificado en mp-api 0.47.2: `formula` acepta anónimas
  elements_include: [O]
  # Se descartan después las ABC3 en que el O no es el elemento con subíndice 3.
  exclude_deprecated: true           # entradas retiradas por MP por errores
  # GNoME (candidatos hipotéticos generados por modelo): fuera del análisis principal,
  # descargadas y marcadas (`is_gnome`) para sensibilidad. Decisión de la autora, 2026-11-13.
  gnome_policy: exclude_and_flag     # exclude_and_flag | include | exclude
  # La E_hull del endpoint `summary` usa el esquema mixto GGA/GGA+U/r2SCAN: la del análisis
  # se toma del endpoint `thermo` con un thermo_type explícito.
  thermo_types: [GGA_GGA+U]          # una sola funcional en el análisis principal
  sensitivity_thermo_types: [R2SCAN] # solo para el análisis de sensibilidad
  thermo_chunk_size: 500             # material_ids por consulta al endpoint thermo
  fields:
    - material_id
    - formula_pretty
    - structure
    - theoretical
    - database_IDs
    - energy_above_hull
    - formation_energy_per_atom
    - symmetry
    - deprecated
    - builder_meta                   # lote de cálculo (batch_id): procedencia y detección de GNoME

# ---------------------------------------------------------------------------
# F1.2 Fuentes externas (descargadas en data/raw/, no versionadas)
# ---------------------------------------------------------------------------
external_sources:
  gu2022:
    # El DOI del artículo (10.5281/zenodo.6348980) es el "concepto"; la versión es 6348981.
    zenodo_record: 6348981
    file: kaist-amsg/PerovskiteSynthesizability_Manuscript2021-Release.zip
    md5: 1db13f82d7c32dae0c08c46c75ccd41d  # publicado por Zenodo  # pragma: allowlist secret
    # Solo se extraen estos tipos: los .pkl/.pth.tar (pickle) NO se abren fuera de F3.5.
    extract_extensions: [.md, .csv, .json, .cif]
    split_index: 0                          # el test de positivos es igual en las 100 particiones
  bartel2019:
    repo: https://github.com/CJBartel/perovskite-stability
    commit: 965b8de5b379dde09a6cb1f223ae0f0b9d3ce54e  # fijado; licencia MIT  # pragma: allowlist secret
    table: TableS1.csv                      # 576 ABX3 experimentales (exp_label ±1)

# ---------------------------------------------------------------------------
# F1.3 Identificación de perovskitas por conectividad (regla 2.1.1)
# ---------------------------------------------------------------------------
identification:
  oxidation_states:
    method: bv_analyzer              # BVAnalyzer; respaldo: oxi_state_guesses
    fallback: oxi_state_guesses
  coordination:
    method: crystalnn                # CrystalNN / ChemEnv
    b_site_cn: 6                     # B en coordinación octaédrica
    a_site_cn_min: 8                 # NC(A) con CrystalNN (catión–anión)
    a_site_cn_max: 12
    # Regla híbrida (2026-11-13): CrystalNN subestima la NC de los A con par libre; para
    # ellos se acepta un recuento de O por distancia. Sensibilidad: sin esta regla.
    lone_pair_a_rule:
      elements: [Bi, Pb, Sn, Sb, Tl, Hg]
      cutoff_ang: 3.3
      min_o: 8
  octahedral_connectivity:
    sharing: corner_only             # BO6 comparten SOLO vértices
    # 135° (2026-11-13, antes 140° propuesto): con 140° se perdían perovskitas Pnma muy
    # inclinadas (GdScO3, LuFeO3…, 134–140°). El tipo LiNbO3 (~137°) queda fuera por la
    # NC(A) = 6, no por el ángulo. Sensibilidad: 140°.
    min_b_o_b_angle_deg: 135.0
    sensitivity_min_b_o_b_angle_deg: 140.0
  structure_matcher:                 # tolerancias por defecto de pymatgen (PROPUESTA)
    ltol: 0.2
    stol: 0.3
    angle_tol: 5.0
    primitive_cell: true
    scale: true
    attempt_supercell: true
  # Formadores de polianiones en el "sitio B": se excluyen (carbonatos,
  # nitratos, boratos, yodatos, etc.). PROPUESTA (F1.3).
  polyanion_b_elements: [B, C, N, P, S, Se, Cl, Br, I]
  # Politipos hexagonales (octaedros que comparten caras): clase aparte.
  hexagonal_polytypes: [2H, 4H, 6H]
  manual_validation_min_cases: 50    # F1.4, docs/validacion_manual.md

# ---------------------------------------------------------------------------
# F1.4–F1.5 Etiquetado por composición (decisiones de la autora, 2026-11-14)
# ---------------------------------------------------------------------------
labeling:
  # La revisión manual de F1.4 PREVALECE sobre la clasificación automática en las entradas
  # revisadas. El criterio automático NO se ajusta con esos 59 casos (riesgo de sobreajuste).
  manual_review: docs/validacion_manual_casos.csv
  # Composiciones sintetizadas cuya única evidencia de perovskita es un caso límite sin
  # revisar o una entrada "dudosa": categoría `ambiguous`, ni P ni U en el análisis principal.
  ambiguous_policy: exclude          # exclude | positive
  sensitivity_ambiguous_policy: positive

# ---------------------------------------------------------------------------
# F1.5 Banderas de sensibilidad (se conservan en el análisis principal)
# ---------------------------------------------------------------------------
sensitivity_flags:                   # listas iniciales; ampliar en F1.5
  high_pressure_or_metastable: [MgSiO3, BiCoO3, PbVO3, BiScO3]   # lista curada (ampliable)
  # Regla DFT (decisión de la autora, 2026-11-14): positiva cuya perovskita experimental queda
  # ≥ este valor por encima del polimorfo más estable de la composición (E_hull GGA/GGA+U), con
  # el estado fundamental NO perovskita. Solo para sensibilidad (F3.6); no cambia etiquetas.
  metastable_dft_gap_ev_per_atom: 0.05
  ambiguous_oxidation_state: [BiNiO3, CaFeO3]

# ---------------------------------------------------------------------------
# Familias químicas del elemento B (esquema `family` y estratificación del holdout)
# PROPUESTA (F1.6): Sc va en 3d, Y en 4d/5d y La en 4f (serie La–Lu).
# Todo elemento B no listado se asigna a `main_group`.
# ---------------------------------------------------------------------------
b_families:
  3d: [Sc, Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn]
  4d_5d: [Y, Zr, Nb, Mo, Tc, Ru, Rh, Pd, Ag, Cd, Hf, Ta, W, Re, Os, Ir, Pt, Au, Hg]
  4f_5f: [La, Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu,
          Ac, Th, Pa, U, Np, Pu, Am, Cm, Bk, Cf, Es, Fm, Md, No, Lr]
  default_family: main_group

# ---------------------------------------------------------------------------
# F1.7 Esquemas de partición (regla 2.1.4)
# ---------------------------------------------------------------------------
splits:
  backend: matfold                   # PROPUESTA: si MatFold no es compatible, "own" (bitácora)
  schemes: [random, group_system, loeo_A, loeo_B, family, cluster, temporal]
  random:
    n_splits: 5
  group_system:                      # SOLO diagnóstico (se espera ≈ random)
    n_splits: 5
  loeo_B:
    min_positives_per_element: 5     # por debajo: fusionar por familia o reportar aparte
    small_group_policy: merge_family # merge_family | report_separately
  loeo_A:
    min_positives_per_element: 5
    small_group_policy: report_separately
  cluster:                           # LOCO-CV (Meredig et al., 2018): k-means sobre MAGPIE estandarizado
    feature_set: magpie
    # k = 5 (decisión de la autora, 2026-11-14): la silueta es plana (0,148–0,165 para k = 2–10)
    # y no indica un k natural; k = 5 está a 0,003 del máximo e iguala los 5 folds de `random`.
    n_clusters: 5
    k_scan: [2, 3, 4, 5, 6, 7, 8, 9, 10]   # descriptivo (Meredig): mediana entre k
  temporal:
    # Año de primera caracterización = el más antiguo de las referencias de ICSD (procedencia de
    # MP) de sus entradas perovskita experimentales; NO la fecha de carga en MP.
    target_test_fraction: 0.15       # el corte deja ~15 % de las positivas en el test
    cutoff_year: null                # null: se calcula con target_test_fraction sobre el pool
  # Análisis secundario S1 (preregistro §10b): ¿cada esquema extrapola de verdad?
  extrapolation:
    feature_set: magpie
    pca_variance: 0.95               # principal; ajustado solo con train
    sensitivity_pca_variance: null   # sensibilidad: espacio estandarizado completo
    reference_scheme: random
    reference_quantile: 0.95         # grupo extrapolativo si su mediana > q95 de `random`

# ---------------------------------------------------------------------------
# F1.8 Holdout externo congelado por grupos (regla 2.1.5)
# ---------------------------------------------------------------------------
holdout:
  definition: reserved_b_elements    # composiciones cuyo B está en el conjunto reservado
  stratify_by: b_family
  target_positive_fraction: [0.10, 0.15]
  seed_from: configs/seeds.yaml#holdout_seed
  path: data/splits/holdout_frozen.csv
  hashes_path: data/splits/HASHES.json
  train_pool_path: data/processed/train_pool.parquet

# ---------------------------------------------------------------------------
# F2 Features (regla 2.1.8). Se calculan una vez por composición: son transformaciones fijas
# de la fórmula, sin parámetros ajustados. La imputación, el umbral de varianza y el escalado
# van dentro del Pipeline de cada fold (regla 2.1.6).
# ---------------------------------------------------------------------------
features:
  families:
    # Principal. Sin τ (decisión de la autora, 2026-11-14): τ se ajustó con la TableS1 de
    # Bartel et al. (2019), que contiene la mayoría de nuestras positivas.
    pre_dft:
      composition: [element_property_magpie, stoichiometry, valence_orbital, ion_property]
      geometric: [t, mu]
    # Sensibilidad 14 del preregistro: pre_dft + τ, evaluada en todo el conjunto (declarada
    # in-sample) y solo sobre las positivas fuera de la TableS1 (regla 2.1.6).
    pre_dft_tau:
      composition: [element_property_magpie, stoichiometry, valence_orbital, ion_property]
      geometric: [t, mu, tau]
  geometric:
    # Sitios A/B y estados de oxidación con el algoritmo de Bartel (solo la fórmula). NO se usan
    # las columnas A/B del pool: salen de la estructura y, en las positivas, de sus entradas
    # perovskita experimentales, así que dependen de la etiqueta.
    source: bartel2019_algorithm
    # Radios de Shannon de las tablas de Bartel: r_A con el NC disponible más cercano a 12 y
    # r_B con el más cercano a 6 (si no es el nominal, el radio queda marcado como sustituto).
    # Las tablas van incluidas en el paquete (perovskite_pu/features/data, licencia MIT).
  # F2.2: post_dft = pre_dft + E_hull + ΔHf. Cota superior informada por el hull (regla 2.1.8).
  post_dft:
    # E_hull y ΔHf de la entrada PEROVSKITA de menor E_hull de la composición (decisión de la
    # autora, 2026-11-14), no del estado fundamental.
    polymorph: lowest_energy_perovskite
    # Mismo criterio que define las positivas: solo entradas clasificadas `perovskite` en F1.5
    # (las `perovskite_borderline` experimentales pasaron a ambiguas).
    perovskite_classes: [perovskite]
    thermo_type: GGA_GGA+U             # una sola funcional (materials_project.thermo_types)
    sensitivity_thermo_type: R2SCAN    # sensibilidad 4: solo donde hay perovskita en GGA y r2SCAN
    # Composiciones sin entrada perovskita con termodinámica de la funcional: se EXCLUYEN de
    # post_dft (no se imputan). Imputarlas daría la regla "sin polimorfo perovskita → U",
    # derivada de la etiqueta: todas las P tienen esa entrada porque se sintetizaron.
    # Incluye las U con Yb que solo tienen r2SCAN (decisión de la autora, 2026-11-14).
    missing_policy: exclude
  families_post_dft:
    post_dft:
      extends: pre_dft
      thermo: [ehull, eform]
    # Sensibilidad 4 (descriptiva): las mismas features con r2SCAN.
    post_dft_r2scan:
      extends: pre_dft
      thermo: [ehull_r2scan, eform_r2scan]
  output:
    table: data/interim/features_pre_dft.parquet
    metadata: data/interim/features_pre_dft_meta.parquet
    columns: data/interim/features_pre_dft_columns.json
    post_table: data/interim/features_post_dft.parquet
    # Metadatos (entrada elegida, si es experimental, elegibilidad): NUNCA son features.
    post_metadata: data/interim/features_post_dft_meta.parquet
    post_columns: data/interim/features_post_dft_columns.json
